<app-sidebar></app-sidebar>

<div class="centerElements">
    <div class="musicList">
        <div *ngFor="let music of musicList">
            <button pButton (click)="selectMusic(music)">{{music.name}}</button>
        </div>
    </div>
    <button pButton label="Preferencias" (click)="openPreferenciasGamificada()"></button>
</div>

<p-dialog header="Qual o nome da sua música?" [modal]="true" [(visible)]="isFileNameModalOpen" [style]="{ width: '25rem' }">
    <div class="flex justify-content-end gap-2">
        <form (submit)="confirmarModal()">
            <div class="estruturaModal">
                <div class="campoModal">
                    <input type="text" class="campoTexto" pInputText [formControl]="newMusicName" required [ngClass]="{'ng-invalid ng-dirty': newMusicName.touched && newMusicName.invalid}"/>
                </div>
                <div class="botoesModal">
                    <p-button label="Cancel" severity="secondary" (onClick)="fecharModal()" />
                    <p-button label="Save" type="submit"/>
                </div>
            </div>
        </form>
    </div>
</p-dialog>
